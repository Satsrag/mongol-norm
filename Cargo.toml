[package]
name = "mongol-norm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shape-aware normalizer for Traditional Mongolian script: the UTN #57 v4 shaping engine and FVS-pinned canonical normalizer, pure Rust with zero dependencies (optional font backend)."
readme = "README.md"
keywords = ["mongolian", "unicode", "shaping", "normalization", "utn57"]
categories = ["text-processing", "internationalization"]
# The corpus/golden tests read tests/{data,golden} at test time, so they are not packaged.
# fonts/ is the bundled shaping font of the `font` feature, with its notices and pin.
# examples/ is packaged although nothing builds it from the package: maturin's sdist of the
# Python package (python/) carries this manifest as written, and cargo rejects a manifest whose
# `[[example]]` file is missing, so pip could not build the sdist (0.3.0 failed on PyPI so).
# The leading `/` keeps a pattern at the root; a bare `README.md` matched web/README.md too.
include = ["/src/**", "/fonts/**", "/examples/**", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE"]

[lib]
name = "mongol_norm"

[[bin]]
name = "mongol-norm"
path = "src/bin/mongol-norm.rs"

# `cargo run --release --example compare --features font`: FontShaper vs Shaper, word by word
# (docs/development.md). Packaged only to keep the manifest valid in the sdist (see `include`).
[[example]]
name = "compare"
required-features = ["font"]

[features]
# Exposes `Shaper::with_empty_normalize_table` for the Python bindings' test-suite
# (`python/`); never enable it in a published dependent.
testing = []
# `FontShaper`: shaping with the bundled mongfontbuilder font through harfrust (the Rust port
# of HarfBuzz) instead of the ported rules. Pulls in harfrust and its crates; needs Rust 1.85.
# The default build stays dependency-free.
font = ["dep:harfrust"]

[dependencies]
harfrust = { version = "0.14.0", optional = true }

[package.metadata.docs.rs]
all-features = true

# The crate is the workspace root; the PyO3 binding crate (`python/`, published to PyPI
# as `mongol-norm`, not to crates.io) is the only other member.
[workspace]
resolver = "2"
members = ["python"]

# The single version literal: both crates inherit it, maturin reads it for the Python
# package (python/pyproject.toml has `dynamic = ["version"]`), and mongol_norm.__version__
# reports it at runtime (checked by python/tests/test_rust_twin.py).
[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/Satsrag/mongol-norm"
