[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mongol-shape-data"
version = "0.1.0"
description = "Flat, language-agnostic shaping rules for Traditional Mongolian script (derived from mongfontbuilder + UTN #57)."
readme = "README.md"
requires-python = ">=3.6"
license = { text = "OFL-1.1" }
keywords = ["mongolian", "unicode", "shaping", "utn57", "font"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
preprocess = ["mongfontbuilder>=0.10.6"]

[project.urls]
Homepage = "https://github.com/Satsrag/mongol-norm"

[tool.setuptools.packages.find]
include = ["mongol_shape_data*"]

[tool.setuptools.package-data]
mongol_shape_data = ["rules/*.json"]
