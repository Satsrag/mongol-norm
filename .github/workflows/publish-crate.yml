# Publish crates/mongol-norm to crates.io — the Rust half of a release, in lockstep with the
# PyPI publication (publish.yml): the same GitHub Release (tag vX.Y.Z) publishes both artifacts.
#
# crates.io publication uses Trusted Publishing (GitHub OIDC) from the protected `crates-io`
# environment; no long-lived registry token is stored in GitHub. One-time setup: docs/releasing.md.
name: Publish crate to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:

# No job receives repository permissions unless it declares them below.
permissions: {}

# Never cancel an in-flight publication for the same tag/ref.
concurrency:
  group: crates-io-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and package the crate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.registry.outputs.publish }}

    steps:
      - name: Check out the release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Rust 1.82.0
        run: rustup toolchain install 1.82.0 --profile minimal && rustup default 1.82.0

      - name: Verify lockstep versions and (on a release) the tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mongol-norm") | .version')
          # pyproject.toml declares `dynamic = ["version"]`: the Python package takes its
          # version from [workspace.package] too, so the lockstep check is crate == workspace.
          workspace_version=$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')
          test "$version" = "$workspace_version"
          echo "crate and workspace versions agree: $version"
          if [ "$EVENT_NAME" = "release" ]; then
            test "$RELEASE_TAG" = "v$version"
            git fetch --force origin main:refs/remotes/origin/main --no-tags
            git merge-base --is-ancestor HEAD refs/remotes/origin/main
            echo "release tag matches and is merged to main: $RELEASE_TAG"
          fi

      - name: Run the core crate's test suite (the binding crate needs Rust 1.83 and Python)
        run: cargo test -p mongol-norm --locked

      - name: Package and check the crates.io registry state
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mongol-norm") | .version')
          archive="target/package/mongol-norm-$version.crate"
          rm -rf "target/package/mongol-norm-$version" "$archive"
          cargo package -p mongol-norm --locked
          local_checksum=$(sha256sum "$archive" | cut -d' ' -f1)
          status=$(curl --fail-with-body --retry 3 --retry-connrefused \
            --user-agent 'mongol-norm-release-workflow' --output /tmp/crates-version.json \
            --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/mongol-norm/$version" || true)
          case "$status" in
            404)
              echo 'publish=true' >> "$GITHUB_OUTPUT"
              ;;
            200)
              remote_checksum=$(jq -er '.version.checksum' /tmp/crates-version.json)
              test "$local_checksum" = "$remote_checksum"
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              echo "mongol-norm $version already exists with the expected checksum"
              ;;
            *)
              echo "unexpected crates.io response: HTTP $status" >&2
              cat /tmp/crates-version.json >&2
              exit 1
              ;;
          esac

      - name: Save the packaged crate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crate-package
          path: target/package/*.crate
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to crates.io
    if: github.event_name == 'release' && github.repository == 'Satsrag/mongol-norm' && needs.verify.outputs.publish == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/mongol-norm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Rust 1.82.0
        run: rustup toolchain install 1.82.0 --profile minimal && rustup default 1.82.0

      - name: Revalidate the remote tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/release-remote" --no-tags
          test "$(git rev-list -n 1 refs/tags/release-remote)" = "$(git rev-parse HEAD)"

      - name: Package
        run: cargo package -p mongol-norm --locked

      - name: Authenticate to crates.io with GitHub OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish mongol-norm to crates.io
        run: cargo publish -p mongol-norm --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Verify the publication checksum
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mongol-norm") | .version')
          archive="target/package/mongol-norm-$version.crate"
          local_checksum=$(sha256sum "$archive" | cut -d' ' -f1)
          for attempt in {1..18}; do
            status=$(curl --retry 3 --retry-connrefused \
              --user-agent 'mongol-norm-release-workflow' --output /tmp/crates-version.json \
              --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/mongol-norm/$version" || true)
            case "$status" in
              200)
                remote_checksum=$(jq -er '.version.checksum' /tmp/crates-version.json)
                test "$local_checksum" = "$remote_checksum"
                exit 0
                ;;
              404|429|500|502|503|504)
                sleep 10
                ;;
              *)
                echo "unexpected crates.io response: HTTP $status" >&2
                cat /tmp/crates-version.json >&2
                exit 1
                ;;
            esac
          done
          echo "timed out waiting for mongol-norm $version on crates.io" >&2
          exit 1
