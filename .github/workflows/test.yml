name: Test

# Repo layout: a single self-contained package, mongol-norm/. The shaping +
# normalize JSON is bundled in mongol_norm/data/ (no separate data package,
# no runtime dependency). CI installs it locally (no PyPI yet) and runs the
# test suite, which covers all shaping logic, the normalize round-trip /
# canonicity / prefix-stability properties, the normalize-table export, and
# the mongfontbuilder core-hud / eac-hud TSV regression sets.
# The Rust twin lives in crates/mongol-norm/ (workspace root Cargo.toml); its
# tables are generated from the same JSON by scripts/gen_rust_tables.py and
# kept fresh by tests/test_rust_twin.py.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run unittest suite
        # Auto-discovers every tests/test_*.py so new test modules can't be
        # silently skipped. Covers:
        #   - hand-written shaper tests (shape / same_shape / normalize)
        #   - joiner-token semantics (nirugu / ZWJ in shape + normalize)
        #   - normalize round-trip + shape-canonicity + prefix-stability
        #   - normalize-table export (compute == load)
        #   - 225 mongfontbuilder core-hud cases (100%)
        #   - 3513 mongfontbuilder eac-hud cases (100%, 5 UTN-xfail)
        #   - generated Rust tables are fresh + crate/package versions agree (test_rust_twin)
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Install stable Rust (rustfmt, clippy, wasm32 target)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test (stable)
        run: cargo test --workspace --locked

      - name: Build the library for wasm32-unknown-unknown
        run: cargo build -p mongol-norm --lib --target wasm32-unknown-unknown --locked

      - name: Rustdoc (broken intra-doc links are errors)
        run: cargo doc -p mongol-norm --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Test on the MSRV (1.82.0)
        run: |
          rustup toolchain install 1.82.0 --profile minimal
          cargo +1.82.0 test --workspace --locked

      - name: Package
        run: cargo package -p mongol-norm --locked
