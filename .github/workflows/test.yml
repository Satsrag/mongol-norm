name: Test

# Repo layout: the shaping engine is the Rust crate at the repository root (Cargo.toml,
# src/, tests/ with the shared fixtures); the PyPI package mongol-norm is its PyO3
# binding under python/ (the binding crate + mongol_norm/, built with maturin; the
# Python test-suite and the generator scripts live there too). The shaping +
# normalize JSON in python/mongol_norm/data/ is the source of the generated Rust
# tables (python/scripts/gen_rust_tables.py) and of the tooling; the runtime does
# not read it.
#
# The Python job builds the extension in place (maturin develop) on every
# supported CPython and runs the unittest suite, which covers all shaping logic,
# the normalize round-trip / canonicity / prefix-stability properties, the
# normalize-table export, the mongfontbuilder core-hud / eac-hud TSV regression
# sets and the binding layer. The Rust job checks the whole workspace on stable
# and the core crate's MSRV / wasm32 / packaging guarantees.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# No job needs more than read access to the repository.
permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install stable Rust (the binding crate needs 1.83+)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      # `maturin develop` refuses to run outside a virtual environment. Exporting
      # VIRTUAL_ENV and PATH is what `source .venv/bin/activate` does, but it
      # persists across the following steps. Everything Python runs from python/
      # (pyproject.toml, the binding crate, the package and the test-suite).
      - name: Create a virtual environment
        working-directory: python
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build the extension in place
        # Same version range as [build-system].requires in pyproject.toml. The
        # `testing` feature exposes the fallback hook python/tests/test_shaper.py
        # needs; release wheels are built without it (publish.yml).
        working-directory: python
        run: |
          python -m pip install 'maturin>=1.15,<2'
          maturin develop --locked --features testing

      - name: Run unittest suite
        # The test support module raises when the fallback hook is missing, so the
        # hook-gated tests can never skip silently in CI.
        env:
          MONGOL_NORM_REQUIRE_TESTING_HOOK: "1"
        working-directory: python
        # Auto-discovers every python/tests/test_*.py so new test modules can't be
        # silently skipped. Covers:
        #   - hand-written shaper tests (shape / same_shape / normalize)
        #   - joiner-token semantics (nirugu / ZWJ in shape + normalize)
        #   - normalize round-trip + shape-canonicity + prefix-stability
        #   - normalize-table export (compute == bundled)
        #   - 225 mongfontbuilder core-hud cases (100%)
        #   - 3513 mongfontbuilder eac-hud cases (100%, 5 UTN-xfail)
        #   - the binding layer: dict formats, error mapping, console script (test_bindings, test_cli)
        #   - generated Rust tables are fresh + __version__ equals the workspace version (test_rust_twin)
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Generated artifacts are fresh
        # The bundled normalize table, the Rust tables and the compat goldens are
        # generated from python/mongol_norm/data/*.json, and the font backend's glyph
        # table from fonts/hudum.glyphs.txt; each script's --check fails when the
        # committed file differs from what it would generate now. The scripts locate
        # the repository from their own path; run them from the root.
        run: |
          python python/scripts/gen_rust_tables.py --check
          python python/scripts/gen_normalize_table.py --check
          python python/scripts/gen_compat_goldens.py --check
          python python/scripts/gen_font_shaper.py --check

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # No setup-python here: nothing links libpython (the binding crate's lib has
      # test = false, and `extension-module` leaves the CPython symbols unresolved).
      # Clippy's pyo3 build script only reads the interpreter config from the image's
      # python3, and would fall back to the abi3 default config without one.
      - name: Install stable Rust (rustfmt, clippy, wasm32 target)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (whole workspace, all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test (stable, whole workspace)
        run: cargo test --workspace --locked

      # The remaining steps are core-crate only (-p mongol-norm): the binding crate
      # needs Rust 1.83 and a Python interpreter, has no wasm32 story and is not
      # published to crates.io.
      - name: Test the font backend (feature `font`; needs Rust 1.85)
        run: cargo test -p mongol-norm --features font --locked

      # A gate: the two backends agree on all of these seeded random strings (#52), so any
      # string they shape differently fails the build (tests/font_vs_engine.rs pins the
      # corpora). The step reports where: an error annotation on the run, the full report in the
      # job summary, and every differing word in the `font-vs-engine` artifact. Seeded, so the
      # result only moves when a backend changes. It reuses the debug build of the step above
      # (`cargo test` builds the examples), which shapes 100k strings in well under a minute.
      - name: Compare the font backend with the rule engine
        run: >-
          cargo run -p mongol-norm --example compare --features font --locked --
          --random 100000 --groups 50 --limit 100
          --markdown "$GITHUB_STEP_SUMMARY" --github-warning --fail-on-diff
          --tsv font-vs-engine.tsv

      # Also after a failed comparison: the artifact is where the differing words are.
      - name: Save the words the two backends shape differently
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: font-vs-engine
          path: font-vs-engine.tsv
          if-no-files-found: warn
          retention-days: 14

      # Not a gate: a new seed every run (the run id, which a re-run keeps) explores strings the
      # fixed sample never builds. A difference here is a lead to follow up, not a failure. The
      # warning names the seed, and `--random 100000 --seed <seed>` reproduces it locally.
      - name: Compare the backends on a fresh random sample (report only)
        run: >-
          cargo run -p mongol-norm --example compare --features font --locked --
          --random 100000 --seed ${{ github.run_id }} --groups 50 --limit 100
          --markdown "$GITHUB_STEP_SUMMARY" --github-warning
          --tsv font-vs-engine-fresh.tsv

      - name: Save the words the two backends shape differently on the fresh sample
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: font-vs-engine-fresh
          path: font-vs-engine-fresh.tsv
          if-no-files-found: warn
          retention-days: 14

      - name: Build the core library for wasm32-unknown-unknown (with and without the font backend)
        run: |
          cargo build -p mongol-norm --lib --target wasm32-unknown-unknown --locked
          cargo build -p mongol-norm --lib --target wasm32-unknown-unknown --features font --locked

      - name: Rustdoc (broken intra-doc links are errors)
        run: cargo doc -p mongol-norm --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

      # Without the font feature: harfrust needs 1.85, the default build keeps 1.82.
      - name: Test the core crate on its MSRV (1.82.0)
        run: |
          rustup toolchain install 1.82.0 --profile minimal
          cargo +1.82.0 test -p mongol-norm --locked

      - name: Package the core crate
        run: cargo package -p mongol-norm --locked
