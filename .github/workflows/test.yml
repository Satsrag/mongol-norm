name: Test

# Repo layout: two sibling Python packages share this repo.
#   mongol-shape-data/  → flat shaping rules (data only)
#   mongol-norm/        → the shaper; depends on mongol-shape-data
# CI installs both locally (no PyPI yet) and runs the mongol-norm test
# suite, which covers all shaping logic plus the mongfontbuilder
# core-hud / eac-hud TSV regression sets.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install both packages
        run: |
          python -m pip install --upgrade pip
          pip install ./mongol-shape-data
          pip install ./mongol-norm

      - name: Run unittest suite
        working-directory: mongol-norm
        # All three modules together. test_eac_hud prints its own
        # pass/fail/UTN-xfail summary; test_core_hud + test_shaper
        # use the standard unittest output. The three together cover:
        #   - 113 hand-written shaper tests
        #   - 177 mongfontbuilder core-hud cases (100%)
        #   - 3507 mongfontbuilder eac-hud cases (100%, 5 UTN-xfail)
        run: |
          python -m unittest tests.test_shaper tests.test_core_hud tests.test_eac_hud -v
