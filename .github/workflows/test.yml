name: Test

# Repo layout: a single self-contained package, mongol-norm/. The shaping +
# normalize JSON is bundled in mongol_norm/data/ (no separate data package,
# no runtime dependency). CI installs it locally (no PyPI yet) and runs the
# test suite, which covers all shaping logic, the normalize round-trip /
# canonicity / prefix-stability properties, the normalize-table export, and
# the mongfontbuilder core-hud / eac-hud TSV regression sets.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run unittest suite
        # test_eac_hud / test_round_trip print their own pass/fail summaries;
        # the others use standard unittest output. Together they cover:
        #   - hand-written shaper tests (shape / same_shape / normalize)
        #   - normalize round-trip + shape-canonicity + prefix-stability
        #   - normalize-table export (compute == load)
        #   - 225 mongfontbuilder core-hud cases (100%)
        #   - 3513 mongfontbuilder eac-hud cases (100%, 5 UTN-xfail)
        run: |
          python -m unittest tests.test_shaper tests.test_round_trip \
            tests.test_normalize_table tests.test_core_hud tests.test_eac_hud -v
