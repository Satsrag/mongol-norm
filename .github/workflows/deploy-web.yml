name: Build and deploy web playground

on:
  release:
    types: [published]
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the tested page to www.satsrag.dev/norm/ (main only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and test the browser page
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Verify the release source
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')
          test "$RELEASE_TAG" = "v$version"
          git fetch --force origin main:refs/remotes/origin/main \
            "refs/tags/$RELEASE_TAG:refs/tags/release-remote" --no-tags
          test "$(git rev-list -n 1 refs/tags/release-remote)" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main

      - name: Install the binding generator pinned by the web lockfile
        run: |
          version=$(python3 -c 'import tomllib, pathlib; data=tomllib.loads(pathlib.Path("web/wasm/Cargo.lock").read_text()); print(next(p["version"] for p in data["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Check the browser adapter
        run: |
          cargo fmt --manifest-path web/wasm/Cargo.toml --check
          cargo clippy --manifest-path web/wasm/Cargo.toml --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Install the browser test tools
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build and test
        run: npm --prefix web test

      - name: Save the tested static site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mongol-norm-web
          path: web/public/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to www.satsrag.dev/norm/
    needs: build
    if: >-
      github.repository == 'Satsrag/mongol-norm' &&
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-norm-page
      cancel-in-progress: false
    steps:
      - name: Check deployment credentials
        env:
          DEPLOY_KEY: ${{ secrets.PAGE_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo '::error::PAGE_DEPLOY_KEY is missing. See docs/releasing.md.'
            exit 1
          fi

      - name: Download the tested page
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mongol-norm-web
          path: page

      - name: Check out the tools site
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: Satsrag/satsrag.github.io
          ref: master
          path: site
          ssh-key: ${{ secrets.PAGE_DEPLOY_KEY }}

      - name: Update the normalizer page
        run: |
          mkdir -p site/norm
          rsync -a --delete page/ site/norm/

      - name: Commit and push the page
        working-directory: site
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add -- norm
          if git diff --cached --quiet; then
            echo 'The published page already matches this build.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "deploy(norm): mongol-norm $SOURCE_REF" \
            -m "Built and browser-tested from Satsrag/mongol-norm at $SOURCE_SHA."
          # Other projects also publish to this branch. Preserve their changes.
          for attempt in 1 2 3; do
            git pull --rebase origin master
            if git push origin HEAD:master; then
              exit 0
            fi
            sleep 2
          done
          echo 'Could not push the page after three attempts.' >&2
          exit 1
