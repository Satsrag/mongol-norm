# Build and publish the PyPI package `mongol-norm` — the Python half of a release, in
# lockstep with the crates.io publication (publish-crate.yml): the same GitHub Release
# (tag vX.Y.Z) publishes both artifacts from the same commit.
#
# The package is a PyO3 extension (crates/mongol-norm-py) built with maturin, so a
# release is a wheel matrix — Linux x86_64/aarch64 (manylinux2014 and musllinux_1_2),
# macOS x86_64/arm64, Windows x64, all cp39-abi3 — plus an sdist. Every wheel that can
# run on its build runner is smoke-tested there (install from dist/, import, shape a
# word, run the console script) before anything is published; the sdist is built and
# installed with pip the way a user without a wheel would.
#
# PyPI publication uses Trusted Publishing (GitHub OIDC) from the protected `pypi`
# environment; no API token is stored in GitHub. One-time setup: docs/releasing.md.
# A manual run (workflow_dispatch, any branch) builds, smoke-tests and uploads every
# distribution as a workflow artifact and never publishes.
name: Build and publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

# No job receives repository permissions unless it declares them below.
permissions: {}

# Never cancel an in-flight publication for the same tag/ref.
concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

env:
  # maturin release used by PyO3/maturin-action (a tagged PyO3/maturin release). Keep it
  # inside [build-system].requires of pyproject.toml, which governs the sdist builds.
  MATURIN_VERSION: v1.15.0

jobs:
  verify:
    name: Verify the release commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out the release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install stable Rust (the binding crate needs 1.83+)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      # The version literal lives only in [workspace.package] of the root Cargo.toml;
      # maturin, the crate and mongol_norm.__version__ all derive from it.
      - name: Verify the release tag matches the workspace version and is merged to main
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')
          test "$RELEASE_TAG" = "v$version"
          git fetch --force origin main:refs/remotes/origin/main --no-tags
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          echo "release tag matches the workspace version and is merged to main: $RELEASE_TAG"

      # `maturin develop` refuses to run outside a virtual environment. Exporting
      # VIRTUAL_ENV and PATH is what `source .venv/bin/activate` does, but it persists
      # across the following steps.
      - name: Create a virtual environment
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build the extension in place
        run: |
          python -m pip install 'maturin>=1.15,<2'
          maturin develop --locked --features testing

      - name: Verify the runtime version agrees with the workspace version
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')
          runtime_version=$(python -c 'import mongol_norm; print(mongol_norm.__version__)')
          test "$runtime_version" = "$version"
          echo "runtime and workspace versions agree: $version"

      - name: Run the Python test suite
        # The test support module raises when the fallback hook is missing, so the
        # hook-gated tests can never skip silently in CI.
        env:
          MONGOL_NORM_REQUIRE_TESTING_HOOK: "1"
        run: python -m unittest discover -s tests -p 'test_*.py'

  linux:
    name: Wheel linux ${{ matrix.target }} (manylinux2014)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]

    steps:
      - name: Check out the release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python (smoke test)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      # Builds inside the manylinux2014 container for the target (aarch64 is
      # cross-compiled). The explicit policy makes a wheel that would only satisfy a
      # newer glibc fail the build instead of silently getting a newer tag.
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: '2014'
          args: --release --locked --out dist

      - name: Smoke-test the wheel (import, shape a word, run the console script)
        if: matrix.target == 'x86_64'
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          python -m pip install --no-index --find-links "$GITHUB_WORKSPACE/dist" mongol-norm
          python -c "import mongol_norm; print(mongol_norm.__version__); assert mongol_norm.MongolianShaper().shape('ᠰᠠᠢᠨ') == ['S', 'A', 'I', 'I', 'A']"
          python -c "import mongol_norm._native as n; assert not hasattr(n, '_shaper_with_empty_normalize_table'), 'testing hook shipped'"
          test "$(mongol-norm shape ᠰᠠᠢᠨ | tr -d '\r')" = 'S+A+I+I+A'

      - name: Save the wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  musllinux:
    name: Wheel linux ${{ matrix.target }} (musllinux_1_2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]

    steps:
      - name: Check out the release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Cross-compiled in the rust-musl-cross container; a musl wheel cannot be
      # installed on the glibc runner, so there is no smoke test here.
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: musllinux_1_2
          args: --release --locked --out dist

      - name: Save the wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-musllinux-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Wheel windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out the release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The build links against this interpreter's python3.lib; the smoke test uses it.
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          architecture: x64

      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: x64
          args: --release --locked --out dist

      # bash + PYTHONUTF8 keep the Mongolian argument and output UTF-8 on Windows;
      # `tr -d '\r'` tolerates a CRLF from the console script.
      - name: Smoke-test the wheel (import, shape a word, run the console script)
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          python -m pip install --no-index --find-links "$GITHUB_WORKSPACE/dist" mongol-norm
          python -c "import mongol_norm; print(mongol_norm.__version__); assert mongol_norm.MongolianShaper().shape('ᠰᠠᠢᠨ') == ['S', 'A', 'I', 'I', 'A']"
          python -c "import mongol_norm._native as n; assert not hasattr(n, '_shaper_with_empty_normalize_table'), 'testing hook shipped'"
          test "$(mongol-norm shape ᠰᠠᠢᠨ | tr -d '\r')" = 'S+A+I+I+A'

      - name: Save the wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Wheel macos ${{ matrix.target }}
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # Cargo's release default strip = "debuginfo" runs Apple's `strip`, which (CLT 27
    # beta) leaves the LINKEDIT string pool 4-byte aligned; the macOS 27 dyld rejects
    # that for binaries linked against SDK >= 27. Not stripping costs ~70 KB per wheel
    # and keeps the wheels loadable whatever toolchain the runner has.
    env:
      CARGO_PROFILE_RELEASE_STRIP: none
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]

    steps:
      - name: Check out the release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python (smoke test)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      # macos-latest is Apple silicon: the arm64 wheel is native and smoke-tested,
      # the x86_64 wheel is cross-compiled.
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          args: --release --locked --out dist

      - name: Smoke-test the wheel (import, shape a word, run the console script)
        if: matrix.target == 'aarch64'
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          python -m pip install --no-index --find-links "$GITHUB_WORKSPACE/dist" mongol-norm
          python -c "import mongol_norm; print(mongol_norm.__version__); assert mongol_norm.MongolianShaper().shape('ᠰᠠᠢᠨ') == ['S', 'A', 'I', 'I', 'A']"
          python -c "import mongol_norm._native as n; assert not hasattr(n, '_shaper_with_empty_normalize_table'), 'testing hook shipped'"
          test "$(mongol-norm shape ᠰᠠᠢᠨ | tr -d '\r')" = 'S+A+I+I+A'

      - name: Save the wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-macos-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out the release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # `maturin sdist` runs `cargo metadata`, and building the sdist needs 1.83+;
      # neither should depend on the image's preinstalled toolchain.
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Build the sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist

      - name: Set up Python (smoke test)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      # PyPI rejects an upload whose metadata declares a License-File the archive
      # does not contain (0.1.0's sdist failed exactly like that); twine does not
      # check it, scripts/check_dist_metadata.py does.
      - name: Validate the sdist metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'twine>=6'
          python -m twine check --strict dist/*
          python scripts/check_dist_metadata.py --require LICENSE --require NOTICE dist/*

      # What `pip install mongol-norm` does on a platform without a wheel: pip fetches
      # maturin into an isolated build environment and compiles the extension with the
      # host Rust toolchain.
      - name: Smoke-test the sdist (pip builds it, import, shape a word, run the console script)
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          python -m pip install "$GITHUB_WORKSPACE"/dist/*.tar.gz
          python -c "import mongol_norm; print(mongol_norm.__version__); assert mongol_norm.MongolianShaper().shape('ᠰᠠᠢᠨ') == ['S', 'A', 'I', 'I', 'A']"
          python -c "import mongol_norm._native as n; assert not hasattr(n, '_shaper_with_empty_normalize_table'), 'testing hook shipped'"
          test "$(mongol-norm shape ᠰᠠᠢᠨ | tr -d '\r')" = 'S+A+I+I+A'

      - name: Save the sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-sdist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release' && github.repository == 'Satsrag/mongol-norm'
    needs: [verify, linux, musllinux, windows, macos, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/mongol-norm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the release commit (for scripts/check_dist_metadata.py)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Download every distribution into dist/
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: Check the distribution set is complete
        shell: bash
        run: |
          set -euo pipefail
          ls -l dist/
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 7
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1

      # Last gate before the upload: every archive's metadata must be consistent
      # (PyPI's own License-File check, which twine does not perform).
      - name: Validate every distribution's metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'twine>=6'
          python -m twine check --strict dist/*
          python scripts/check_dist_metadata.py --require LICENSE --require NOTICE dist/*

      # Pinned release/v1 commit for supply-chain stability. Uploads everything in
      # dist/ with PEP 740 attestations, minted from the job's OIDC identity.
      - name: Publish distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
