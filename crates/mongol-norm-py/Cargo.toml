[package]
name = "mongol-norm-py"
version.workspace = true
edition.workspace = true
# PyO3 0.29 needs 1.83; the core crate keeps its own 1.82 MSRV.
rust-version = "1.83"
license.workspace = true
repository.workspace = true
description = "Python bindings for mongol-norm (published to PyPI as `mongol-norm`, not to crates.io)"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
doc = false

[features]
# Exposes `_shaper_with_empty_normalize_table` for tests/test_shaper.py's fallback cases.
# `maturin develop --features testing`; release wheels are built without it.
testing = ["mongol-norm/testing"]

[dependencies]
mongol-norm = { path = "../mongol-norm", version = "0.1.0" }
pyo3 = { version = "0.29.2", features = ["abi3-py39"] }
