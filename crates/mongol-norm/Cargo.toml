[package]
name = "mongol-norm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shape-aware normalizer for Traditional Mongolian script: the UTN #57 v4 shaping engine and FVS-pinned canonical normalizer, pure Rust with zero dependencies."
readme = "README.md"
keywords = ["mongolian", "unicode", "shaping", "normalization", "utn57"]
categories = ["text-processing", "internationalization"]
# The corpus/golden tests read ../../tests at test time, so they are not packaged.
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]

[lib]
name = "mongol_norm"

[[bin]]
name = "mongol-norm"
path = "src/bin/mongol-norm.rs"

[dependencies]
