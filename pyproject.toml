[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mongol-norm"
version = "0.0.4"
description = "Shape-aware normalizer for Traditional Mongolian script. Implements the UTN #57 v4 shaping pipeline in pure Python."
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
keywords = ["mongolian", "unicode", "shaping", "normalization", "utn57"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
# No runtime dependencies — the shaping/normalize JSON is bundled in
# mongol_norm/data/ (see scripts/ to regenerate it).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# Regenerating the bundled shaping rules from upstream (scripts/preprocess.py).
preprocess = ["mongfontbuilder>=0.10.6"]

[project.scripts]
mongol-norm = "mongol_norm.shaper:main"

[project.urls]
Homepage = "https://github.com/Satsrag/mongol-norm"

[tool.setuptools.packages.find]
include = ["mongol_norm*"]

[tool.setuptools.package-data]
mongol_norm = ["data/*.json"]
