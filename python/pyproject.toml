[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "mongol-norm"
# Single source of truth: [workspace.package].version in ../Cargo.toml (maturin reads it
# through ./Cargo.toml, the binding crate); mongol_norm.__version__ is read from the
# extension module at import time.
dynamic = ["version"]
description = "Shape-aware normalizer for Traditional Mongolian script. Implements the UTN #57 v4 shaping pipeline — Rust core with Python bindings."
# A distinct name on purpose. maturin re-roots this file at the sdist root, where
# README.md is already the crate's (crates.io) README; with the same name, a wheel
# built from the sdist would carry the crate README as its long description.
readme = "README.pypi.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mongolian", "unicode", "shaping", "normalization", "utn57"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Linguistic",
]
# No runtime dependencies — the engine and its tables are compiled into the
# mongol_norm._native extension (the crate at the repository root).
# mongol_norm/data/*.json ships for tooling (docs/data-format.md); the runtime
# does not read it.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# Regenerating the bundled shaping rules from upstream (python/scripts/preprocess.py).
preprocess = ["mongfontbuilder>=0.10.6"]

[project.scripts]
mongol-norm = "mongol_norm.shaper:main"

[project.urls]
Homepage = "https://github.com/Satsrag/mongol-norm"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "mongol_norm._native"
features = ["pyo3/extension-module"]
# The sdist is what pip needs to build the package: the binding crate, the Python
# package and (as a local path dependency) the engine crate at the repository root —
# maturin roots the archive at the Cargo workspace, so the sdist carries the root
# Cargo.toml + src/ and this directory as python/. The test-suite and the generator
# scripts need the repository checkout (shared fixtures under ../tests) and are
# excluded; the docs are not shipped either.
exclude = [
    { path = "tests/**", format = "sdist" },
    { path = "scripts/**", format = "sdist" },
]
# LICENSE and NOTICE next to this file are copies of the repository's files (maturin
# cannot include `../LICENSE`: include patterns must not contain `..`); they give the
# wheels and the sdist their License-File entries, which PyPI checks. The Python
# test-suite asserts the copies are byte-identical to the root files.
